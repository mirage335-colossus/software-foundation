[package]
name = "foundation-provider-fixture"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "CC0-1.0"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
foundation-appended = { path = "../../../../sdk/appended/rust" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = false
codegen-units = 1

[workspace]
