name: Download this run's bounded evidence
description: Download immutable small bundles for subsequent exact context, producer and byte validation.
inputs:
  pattern:
    description: Fixed artifact-slot suffix pattern, for example source-* or qualification-inputs.
    required: false
    default: '*'
  path:
    description: Fresh runner-local artifact directory.
    required: false
    default: ${{ runner.temp }}/foundation-ci-artifacts
outputs:
  directory:
    description: Directory containing separate immutable artifact bundles.
    value: ${{ steps.directory.outputs.path }}
runs:
  using: composite
  steps:
    - name: Select a fresh local artifact directory
      id: directory
      shell: python
      env:
        ARTIFACT_DIRECTORY: ${{ inputs.path }}
      run: |
        import os
        from pathlib import Path
        path = Path(os.environ['ARTIFACT_DIRECTORY']).absolute()
        if path.exists() or path.is_symlink():
            raise SystemExit('artifact download directory must be new')
        value = str(path)
        if any(c in value for c in '\r\n'):
            raise SystemExit('artifact download path must occupy one line')
        with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as stream:
            stream.write('FOUNDATION_CI_ARTIFACTS_DIR=' + value + '\n')
        with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as stream:
            stream.write('path=' + value + '\n')
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      if: github.server_url == 'https://github.com'
      with:
        pattern: foundation-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.pattern }}
        path: ${{ inputs.path }}
        merge-multiple: false
