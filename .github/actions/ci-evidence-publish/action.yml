name: Retain bounded CI evidence
description: Keep small evidence for one day, with complete release fallback on size or storage failure.
inputs:
  name:
    description: Exact existing CI bundle name.
    required: true
  paths:
    description: Newline-separated repository-relative paths, using the existing bundle layout.
    required: true
  slot:
    description: Certification matrix index; indices above 47 use release storage.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - id: prepare
      if: always()
      shell: python
      env:
        BUNDLE_NAME: ${{ inputs.name }}
        BUNDLE_PATHS: ${{ inputs.paths }}
        ARTIFACT_SLOT: ${{ inputs.slot }}
      run: |
        import subprocess, sys
        subprocess.run([sys.executable, '-B', 'tools/ci_artifacts.py', 'prepare'], check=True)
    - id: upload
      if: always() && steps.prepare.outputs.transport == 'actions'
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ steps.prepare.outputs.artifact-name }}
        path: ${{ steps.prepare.outputs.path }}/*
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
        overwrite: false
    - name: Retain complete evidence through release storage when necessary
      if: always() && (steps.prepare.outputs.transport == 'release' || steps.upload.outcome == 'failure')
      shell: python
      env:
        BUNDLE_NAME: ${{ inputs.name }}
        BUNDLE_PATHS: ${{ inputs.paths }}
      run: |
        import subprocess, sys
        subprocess.run([sys.executable, '-B', 'tools/ci_artifacts.py', 'fallback'], check=True)
