name: Explicit native GUI qualification
'on':
  workflow_dispatch:
    inputs:
      target:
        description: Native execution host
        type: choice
        options:
        - windows-x86_64
        - linux-x86_64
        - linux-aarch64
        default: windows-x86_64
      recipe:
        description: Exact complete GUI-capable dependency recipe already in base
        type: string
        required: true
      graphics_archive_url:
        description: Operator-retained HTTPS host graphics archive; required for Windows
        type: string
        default: ''
      jobs:
        description: Compilation concurrency
        type: choice
        options:
        - '2'
        - '4'
        - '8'
        default: '2'
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  TARGET: ${{ inputs.target }}
  RECIPE: ${{ inputs.recipe }}
  JOBS: ${{ inputs.jobs }}
  GRAPHICS_ARCHIVE_URL: ${{ inputs.graphics_archive_url }}
jobs:
  qualify:
    runs-on: ${{ inputs.target == 'windows-x86_64' && 'windows-2022' || inputs.target == 'linux-aarch64' && 'ubuntu-24.04-arm'
      || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify the explicitly supplied retained Windows graphics input
      if: runner.os == 'Windows'
      run: python .github/scripts/lifecycle.py graphics-input
    - run: python .github/scripts/lifecycle.py fetch-sdk
    - name: Acquire exact pinned GUI inputs for this explicit qualification only
      run: python .github/scripts/lifecycle.py gui-maintain
    - if: runner.os == 'Windows'
      shell: pwsh
      run: ./tools/ci_windows.ps1 -Output 'build/windows-toolchain.json'
    - if: runner.os == 'Windows'
      run: python .github/scripts/lifecycle.py native-gui-check
    - if: runner.os == 'Linux'
      shell: python
      run: |
        import os,subprocess
        subprocess.run(['docker','run','--rm','-e','TARGET','-e','RECIPE','-e','JOBS','-e','PYTHONUTF8=1','-e','PYTHONDONTWRITEBYTECODE=1','-v',os.getcwd()+':/work','-w','/work','debian:bookworm','bash','-euc',
         'apt-get update; apt-get install -y --no-install-recommends ca-certificates python3 nodejs openssl cmake ninja-build git binutils make gpg patch xvfb xauth fonts-dejavu-core libgl1 libopengl0 libgl1-mesa-dri libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev; git config --global --add safe.directory /work; xvfb-run -a python3 .github/scripts/lifecycle.py native-gui-check'],check=True)
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: native-gui-evidence-${{ inputs.target }}-${{ github.run_attempt }}
        path: |-
          build/native-gui/qualification.json
          build/native-gui/source.junit.xml
          build/native-gui/build/Testing/Temporary/
          build/native-gui/build/test-reports/
          build/native-gui/graphics.json
          build/native-gui/graphics-probe.json
          build/native-gui/graphics-test.log
          build/native-gui/graphics-compile.log
          build/native-gui/build/gui/visual-evidence/**/*.json
          build/native-gui/build/gui/visual-evidence/**/*.png
          build/native-gui/build/gui/visual-evidence/**/*.ppm
          build/native-gui/build/gui/visual-evidence/**/*.log
          build/host-graphics/acquisition.json
          build/gui-publication-plan.json
        if-no-files-found: warn
        compression-level: 0
        retention-days: 30
      if: always()
