name: Prepared SDK application and candidate
'on':
  workflow_dispatch:
    inputs:
      profile:
        description: Exact release inventory
        type: choice
        options:
        - core
        - all-gui
        default: core
      recipes:
        description: JSON target-to-recipe map; every selected target is mandatory
        type: string
        required: true
      tag:
        description: Optional new candidate tag
        type: string
        required: false
      experiment:
        description: Keep this candidate a prerelease and ineligible for Latest
        type: boolean
        default: true
      linux_pool:
        description: Standard or explicitly configured faster runners for every platform
        type: choice
        options: [standard, faster]
        default: standard
      jobs:
        description: Auto uses available CPU and RAM; explicit compile override
        type: choice
        options:
        - auto
        - '2'
        - '4'
        - '8'
        default: auto
      require_regression:
        description: Run full candidate regression alongside production and require it before assembly
        type: boolean
        default: false
      execute:
        description: Publish candidate after exact local verification
        type: boolean
        default: false
      graphics_archive_url:
        description: Operator-retained HTTPS host graphics archive; required for Windows all-gui
        type: string
        default: ''
      gui_group:
        description: Exact retained GUI manifest SHA-256 for all-gui; empty for core
        type: string
        required: false
  workflow_call:
    inputs:
      profile:
        description: Exact release inventory
        type: string
        default: core
      recipes:
        description: JSON target-to-recipe map; every selected target is mandatory
        type: string
        required: true
      tag:
        description: Optional new candidate tag
        type: string
        required: true
      experiment:
        description: Keep this candidate a prerelease and ineligible for Latest
        type: boolean
        default: false
      linux_pool:
        description: Standard or explicitly configured faster runners for every platform
        type: string
        default: standard
      jobs:
        description: Auto uses available CPU and RAM; explicit compile override
        type: string
        default: auto
      require_regression:
        description: Run full candidate regression alongside production and require it before assembly
        type: boolean
        default: false
      execute:
        description: Publish candidate after exact local verification
        type: boolean
        default: false
      graphics_archive_url:
        description: Operator-retained HTTPS host graphics archive; required for Windows all-gui
        type: string
        default: ''
      gui_group:
        description: Exact retained GUI manifest SHA-256 for all-gui; empty for core
        type: string
        required: false
    outputs:
      tag:
        description: Verified tag
        value: ${{ jobs.assemble.outputs.tag }}
      inventory_sha256:
        description: Verified inventory sha256
        value: ${{ jobs.assemble.outputs.inventory_sha256 }}
      source_commit:
        description: Verified source commit
        value: ${{ jobs.assemble.outputs.source_commit }}
      delivery_sha256:
        description: Verified delivery sha256
        value: ${{ jobs.assemble.outputs.delivery_sha256 }}
      published:
        description: Verified published
        value: ${{ jobs.assemble.outputs.published || 'false' }}
      regression_result:
        description: Result of the required nested full candidate workflow, or skipped for standalone production
        value: ${{ jobs.assemble.outputs.regression_result }}
permissions:
  contents: read
  actions: read
jobs:
  regression:
    name: Full candidate regression overlapping application production
    if: inputs.require_regression
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/candidate.yml
    with:
      devfast: false
      include_arm: true
      linux_pool: ${{ inputs.linux_pool }}
      build_jobs: ${{ inputs.jobs }}
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - shell: python
      run: |-
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/lifecycle.py', 'application-plan'], check=True)
      id: plan
      env:
        RECIPES: ${{ inputs.recipes }}
        LINUX_POOL: ${{ inputs.linux_pool }}
        FOUNDATION_FASTER_LINUX_RUNNER: ${{ vars.FOUNDATION_FAST_LINUX_RUNNER }}
        FOUNDATION_FASTER_ARM_RUNNER: ${{ vars.FOUNDATION_FAST_ARM_RUNNER }}
        FOUNDATION_FASTER_WINDOWS_RUNNER: ${{ vars.FOUNDATION_FAST_WINDOWS_RUNNER }}
    - name: Retain verified source-${{ github.run_attempt }}
      run: python .github/scripts/lifecycle.py bundle-store
      env:
        BUNDLE_NAME: source-${{ github.run_attempt }}
        BUNDLE_PATHS: |-
          build/source.tar.gz
          build/recipes.json
    permissions:
      contents: write
      actions: read
  application:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      TARGET: ${{ matrix.target }}
      RECIPE: ${{ matrix.recipe }}
      JOBS: ${{ inputs.jobs }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - shell: python
      run: |
        import subprocess,sys
        subprocess.run([sys.executable,'.github/scripts/lifecycle.py','bundle-fetch'],check=True)
      env:
        BUNDLE_NAME: source-${{ github.run_attempt }}
        BUNDLE_OUTPUT: build/source
    - shell: python
      run: |-
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/lifecycle.py', 'fetch-sdk-binary'], check=True)
      name: Fetch exact verified binary SDK and paired checksum; never cold-build
    - name: Verify explicitly retained Windows host graphics input
      if: runner.os == 'Windows' && inputs.profile == 'all-gui'
      run: python .github/scripts/lifecycle.py graphics-input
    - if: runner.os == 'Windows'
      shell: pwsh
      run: ./tools/ci_windows.ps1
    - shell: python
      run: |-
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/lifecycle.py', 'application-build'], check=True)
      if: runner.os == 'Windows'
    - shell: python
      run: |
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/container_job.py', 'application-build'], check=True)
      if: runner.os == 'Linux'
    - if: always()
      name: Retain application and evidence with shared identity verification
      run: python .github/scripts/lifecycle.py application-bundles
      env:
        APPLICATION_SUCCEEDED: ${{ job.status == 'success' }}
        BUNDLE_NAME: application-evidence-${{ matrix.target }}-${{ github.run_attempt }}
        BUNDLE_PATHS: |-
          ${{ job.status == 'failure' && 'build/receipts/failure.json' || '' }}
          build/produced/source.junit.xml
          build/produced/work/build/Testing/Temporary/
          build/produced/work/build/test-reports/
          build/produced/graphics.json
          build/produced/graphics-probe.json
          build/produced/graphics-test.log
          build/produced/graphics-compile.log
          build/produced/graphics-qualification.json
          build/produced/work/build/gui/visual-evidence/**/*.json
          build/produced/work/build/gui/visual-evidence/**/*.png
          build/produced/work/build/gui/visual-evidence/**/*.ppm
          build/produced/work/build/gui/visual-evidence/**/*.log
    permissions:
      contents: write
      actions: read
  assemble:
    name: Verify complete candidate and publish directly after required regression
    if: ${{ always() && needs.prepare.result == 'success' && needs.application.result == 'success' && ((inputs.require_regression && needs.regression.result == 'success') || (!inputs.require_regression && needs.regression.result == 'skipped')) }}
    needs: [prepare, application, regression]
    runs-on: ubuntu-24.04
    environment: ${{ inputs.execute && 'release-publisher' || '' }}
    concurrency:
      group: foundation-release-lifecycle
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Restore source and all required application producers together
      shell: python
      env:
        RECIPES: ${{ inputs.recipes }}
      run: |
        import subprocess,sys
        subprocess.run([sys.executable,'.github/scripts/lifecycle.py','fetch-assembly-inputs'],check=True)
    - shell: python
      run: |-
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/lifecycle.py', 'assemble'], check=True)
      id: result
    - if: ${{ !inputs.execute }}
      name: Retain verified candidate-${{ github.run_attempt }}
      run: python .github/scripts/lifecycle.py bundle-store
      env:
        BUNDLE_NAME: candidate-${{ github.run_attempt }}
        BUNDLE_PATHS: |-
          build/candidate/
          build/delivery.json
          build/publication-request.json
          build/publication-plan.json
    - if: inputs.execute
      name: Publish verified local candidate without a full bundle round trip
      run: python .github/scripts/lifecycle.py publish-candidate
      id: publication
    - if: always() && inputs.execute
      name: Retain verified candidate-delivery-${{ github.run_attempt }}
      run: python .github/scripts/lifecycle.py bundle-store
      env:
        BUNDLE_NAME: candidate-delivery-${{ github.run_attempt }}
        BUNDLE_PATHS: build/receipts/
    permissions:
      contents: write
      actions: read
    outputs:
      regression_result: ${{ needs.regression.result }}
      published: ${{ steps.publication.outputs.published }}
      tag: ${{ steps.result.outputs.tag }}
      inventory_sha256: ${{ steps.result.outputs.inventory_sha256 }}
      source_commit: ${{ steps.result.outputs.source_commit }}
      delivery_sha256: ${{ steps.result.outputs.delivery_sha256 }}

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PROFILE: ${{ inputs.profile }}
  EXPERIMENT: ${{ inputs.experiment }}
  TAG: ${{ inputs.tag }}
  GUI_GROUP: ${{ inputs.gui_group }}
  GRAPHICS_ARCHIVE_URL: ${{ inputs.graphics_archive_url }}
concurrency:
  group: prepared-application-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false
