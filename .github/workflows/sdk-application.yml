name: Prepared SDK application and candidate
'on':
  workflow_dispatch:
    inputs:
      profile:
        description: Exact release inventory
        type: choice
        options:
        - core
        - all-gui
        default: core
      recipes:
        description: JSON target-to-recipe map; every selected target is mandatory
        type: string
        required: true
      tag:
        description: Optional new candidate tag
        type: string
        required: false
      experiment:
        description: Keep this candidate a prerelease and ineligible for Latest
        type: boolean
        default: true
      jobs:
        description: Compile concurrency
        type: choice
        options:
        - '2'
        - '4'
        - '8'
        default: '2'
      execute:
        description: Publish candidate after exact local verification
        type: boolean
        default: false
      graphics_archive_url:
        description: Operator-retained HTTPS host graphics archive; required for Windows all-gui
        type: string
        default: ''
      gui_group:
        description: Exact retained GUI manifest SHA-256 for all-gui; empty for core
        type: string
        required: false
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - shell: python
      run: |-
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/lifecycle.py', 'application-plan'], check=True)
      id: plan
      env:
        RECIPES: ${{ inputs.recipes }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: source-${{ github.run_attempt }}
        path: |-
          build/source.tar.gz
          build/recipes.json
        if-no-files-found: error
        compression-level: 0
        retention-days: 30
  application:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      TARGET: ${{ matrix.target }}
      RECIPE: ${{ matrix.recipe }}
      JOBS: ${{ inputs.jobs }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - shell: python
      run: |-
        import os, subprocess
        subprocess.run(['gh','run','download',os.environ['GITHUB_RUN_ID'],'--repo',os.environ['GITHUB_REPOSITORY'],'--name','source-{attempt}'.replace('{attempt}',os.environ['GITHUB_RUN_ATTEMPT']),'--dir','build/source'],check=True)
    - shell: python
      run: |-
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/lifecycle.py', 'fetch-sdk'], check=True)
      name: Fetch exact complete existing dependency group; never cold-build
    - name: Verify explicitly retained Windows host graphics input
      if: runner.os == 'Windows' && inputs.profile == 'all-gui'
      run: python .github/scripts/lifecycle.py graphics-input
    - if: runner.os == 'Windows'
      shell: pwsh
      run: ./tools/ci_windows.ps1
    - shell: python
      run: |-
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/lifecycle.py', 'application-build'], check=True)
      if: runner.os == 'Windows'
    - shell: python
      run: |
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/container_job.py', 'application-build'], check=True)
      if: runner.os == 'Linux'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: application-${{ matrix.target }}-${{ github.run_attempt }}
        path: |-
          build/produced/*.tar.gz
          build/produced/*.zip
          build/produced/*.json
        if-no-files-found: error
        compression-level: 0
        retention-days: 30
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: application-evidence-${{ matrix.target }}-${{ github.run_attempt }}
        path: |-
          build/produced/source.junit.xml
          build/produced/work/build/Testing/Temporary/
          build/produced/work/build/test-reports/
          build/produced/graphics.json
          build/produced/graphics-probe.json
          build/produced/graphics-test.log
          build/produced/graphics-compile.log
          build/produced/graphics-qualification.json
          build/produced/work/build/gui/visual-evidence/**/*.json
          build/produced/work/build/gui/visual-evidence/**/*.png
          build/produced/work/build/gui/visual-evidence/**/*.ppm
          build/produced/work/build/gui/visual-evidence/**/*.log
        if-no-files-found: error
        compression-level: 0
        retention-days: 30
      if: always()
  assemble:
    needs:
    - prepare
    - application
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - shell: python
      run: |-
        import os, subprocess
        subprocess.run(['gh','run','download',os.environ['GITHUB_RUN_ID'],'--repo',os.environ['GITHUB_REPOSITORY'],'--name','source-{attempt}'.replace('{attempt}',os.environ['GITHUB_RUN_ATTEMPT']),'--dir','build/source'],check=True)
    - shell: python
      run: |
        import json,os,subprocess
        from pathlib import Path
        recipes=json.loads(Path('build/source/recipes.json').read_text())
        for target in recipes:
         subprocess.run(['gh','run','download',os.environ['GITHUB_RUN_ID'],'--repo',os.environ['GITHUB_REPOSITORY'],'--name','application-'+target+'-'+os.environ['GITHUB_RUN_ATTEMPT'],'--dir','build/packages/'+target],check=True)
    - shell: python
      run: |-
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/lifecycle.py', 'assemble'], check=True)
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: candidate-${{ github.run_attempt }}
        path: |-
          build/candidate/
          build/delivery.json
          build/publication-request.json
          build/publication-plan.json
        if-no-files-found: error
        compression-level: 0
        retention-days: 30
  publish:
    if: inputs.execute
    needs: assemble
    runs-on: ubuntu-24.04
    environment: release-publisher
    concurrency:
      group: foundation-release-lifecycle
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - shell: python
      run: |-
        import os, subprocess
        subprocess.run(['gh','run','download',os.environ['GITHUB_RUN_ID'],'--repo',os.environ['GITHUB_REPOSITORY'],'--name','candidate-{attempt}'.replace('{attempt}',os.environ['GITHUB_RUN_ATTEMPT']),'--dir','build'],check=True)
    - shell: python
      run: |-
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/lifecycle.py', 'publish-candidate'], check=True)
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: candidate-delivery-${{ github.run_attempt }}
        path: build/receipts/
        if-no-files-found: error
        compression-level: 0
        retention-days: 30
      if: always()
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PROFILE: ${{ inputs.profile }}
  EXPERIMENT: ${{ inputs.experiment }}
  TAG: ${{ inputs.tag }}
  GUI_GROUP: ${{ inputs.gui_group }}
  GRAPHICS_ARCHIVE_URL: ${{ inputs.graphics_archive_url }}
concurrency:
  group: prepared-application-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false
