name: Temporary native Firefox startup diagnostic
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        seconds: [20, 120]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Compare exact startup fixture with a bounded supplier-size margin
      run: python3 -B .github/scripts/firefox_startup_probe.py '${{ matrix.seconds }}'
    - name: Retain diagnostic results and closed browser logs
      if: success()
      uses: ./.github/actions/ci-evidence-publish
      with:
        name: evidence-batch-firefox-${{ matrix.seconds }}-${{ github.run_attempt }}
        slot: ${{ strategy.job-index }}
        paths: |
          build/firefox-startup-probe/*.json
          build/firefox-startup-probe/trial-*/*.log
