name: Temporary native Firefox startup diagnostic
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Compare exact startup fixture with a bounded supplier-size margin
      run: python3 -B .github/scripts/firefox_startup_probe.py
    - name: Retain diagnostic results and closed browser logs
      if: success()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: firefox-startup-probe
        path: |
          build/firefox-startup-probe/*.json
          build/firefox-startup-probe/trial-*/*.log
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
        overwrite: false
