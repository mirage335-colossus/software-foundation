name: Candidate checks
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  GH_TOKEN: ${{ github.token }}
concurrency:
  group: candidate-${{ github.ref }}-${{ inputs.devfast }}-${{ inputs.linux_pool }}-${{ inputs.include_arm }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: plan
      env:
        DEVFAST: ${{ inputs.devfast }}
        ARM: ${{ inputs.include_arm }}
        POOL: ${{ inputs.linux_pool }}
        FAST: ${{ vars.FOUNDATION_FAST_LINUX_RUNNER }}
      shell: python
      run: |
        import os, subprocess, sys
        command = [sys.executable, 'tools/ci_plan.py', 'plan', '--pool', os.environ['POOL'],
                   '--configured', os.environ['FAST'], '--github-output', os.environ['GITHUB_OUTPUT']]
        if os.environ['DEVFAST'] == 'true': command.append('--devfast')
        if os.environ['ARM'] != 'true': command.append('--no-arm')
        subprocess.run(command, check=True)
  source:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.checks) }}
    runs-on: ${{ matrix.runner }}
    name: Source ${{ matrix.target }} / ${{ matrix.scope }}
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ inputs.build_jobs }}
      CTEST_PARALLEL_LEVEL: '2'
      TARGET: ${{ matrix.target }}
      SCOPE: ${{ matrix.scope }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - if: runner.os == 'Windows'
      shell: pwsh
      run: ./tools/ci_windows.ps1
    - name: Verify host and execute disjoint scope
      shell: python
      run: |
        import os, subprocess, sys
        subprocess.run([sys.executable, 'tools/ci_plan.py', 'host', os.environ['TARGET']], check=True)
        subprocess.run([sys.executable, 'tools/build.py', 'test', 'release', '--label', os.environ['SCOPE']], check=True)
    - if: always()
      name: Retain verified source-${{ matrix.target }}-${{ matrix.scope }}-${{ github.run_attempt }}
      run: python .github/scripts/lifecycle.py bundle-store
      env:
        BUNDLE_NAME: source-${{ matrix.target }}-${{ matrix.scope }}-${{ github.run_attempt }}
        BUNDLE_PATHS: |
          build/release/Testing/Temporary/
          build/release/build-info.txt
          build/release/test-reports/
    permissions:
      contents: write
      actions: read
  package:
    if: ${{ !inputs.devfast }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.packages) }}
    runs-on: ${{ matrix.runner }}
    name: Independent package ${{ matrix.target }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - if: runner.os == 'Windows'
      shell: pwsh
      run: ./tools/ci_windows.ps1
    - env:
        JOBS: ${{ inputs.build_jobs }}
        TARGET: ${{ matrix.target }}
      shell: python
      run: |
        import os, subprocess, sys
        subprocess.run([sys.executable, 'tools/ci_plan.py', 'host', os.environ['TARGET']], check=True)
        subprocess.run([sys.executable, 'tools/ci_plan.py', 'package', '--build', 'build/package',
                        '--jobs', os.environ['JOBS']], check=True)
    - name: Retain verified package-${{ matrix.target }}-${{ github.run_attempt }}
      run: python .github/scripts/lifecycle.py bundle-store
      env:
        BUNDLE_NAME: package-${{ matrix.target }}-${{ github.run_attempt }}
        BUNDLE_PATHS: |
          build/package/packages/*.tar.gz
          build/package/packages/*.zip
          build/package/packages/*.json
    permissions:
      contents: write
      actions: read
  copied:
    # Draft listings require push access even when this job only fetches bytes.
    permissions:
      contents: write
      actions: read
    if: ${{ !inputs.devfast }}
    needs:
    - plan
    - package
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.packages) }}
    runs-on: ${{ matrix.runner }}
    name: Fresh copied archive ${{ matrix.target }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        BUNDLE_NAME: package-${{ matrix.target }}-${{ github.run_attempt }}
        BUNDLE_OUTPUT: build/copied
      shell: python
      run: |
        import subprocess,sys
        subprocess.run([sys.executable,'.github/scripts/lifecycle.py','bundle-fetch'],check=True)
        subprocess.run([sys.executable,'tools/ci_plan.py','check-archives','build/copied','--runtime-only'],check=True)
  sanitizer:
    if: ${{ !inputs.devfast }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - run: python3 tools/build.py test asan --label core --jobs 2
  distribution:
    if: ${{ !inputs.devfast }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Signed package, update, channel and publication failure fixtures
      shell: python
      run: |
        import subprocess, sys
        for suite in ('apt_repo', 'distro_channel', 'distribution_release'):
            subprocess.run([sys.executable, '-B', 'tools/run_tests.py', '--suite', suite,
                '--output', 'build/distribution-tests/' + suite + '.json'], check=True)
    - name: Actual signed APT install, update, rejection and removal in disposable Debian
      shell: python
      run: |
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/container_job.py', 'apt-native-smoke'], check=True)
    - if: always()
      name: Retain verified apt-mechanism-${{ github.run_attempt }}
      run: python .github/scripts/lifecycle.py bundle-store
      env:
        BUNDLE_NAME: apt-mechanism-${{ github.run_attempt }}
        BUNDLE_PATHS: |
          build/apt-evidence/
          build/distribution-tests/
    permissions:
      contents: write
      actions: read
  verdict:
    if: always()
    needs:
    - plan
    - source
    - package
    - copied
    - sanitizer
    - distribution
    runs-on: ubuntu-24.04
    steps:
    - env:
        RESULTS: ${{ toJSON(needs) }}
        DEVFAST: ${{ inputs.devfast }}
      shell: python
      run: |
        import json, os
        results = json.loads(os.environ['RESULTS'])
        required = ['plan', 'source'] if os.environ['DEVFAST'] == 'true' else list(results)
        if any(results[name]['result'] != 'success' for name in required):
            raise SystemExit('Required jobs failed, were skipped or did not finish')
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
            report.write('Selected source scopes and applicable native package checks passed.\n')
            report.write('Prepared SDK, old-runtime, all-GUI and exact release certification remain separate required qualification scopes.\n')
'on':
  workflow_dispatch:
    inputs:
      devfast:
        description: Focused diagnostic only; cannot qualify a release
        type: boolean
        default: false
      linux_pool:
        description: Faster needs an authorized FOUNDATION_FAST_LINUX_RUNNER variable
        type: choice
        options:
        - standard
        - faster
        default: standard
      build_jobs:
        description: Compile concurrency; tests remain bounded independently
        type: choice
        options:
        - '2'
        - '4'
        - '8'
        default: '2'
      include_arm:
        description: Include native Linux ARM64 execution
        type: boolean
        default: true
  workflow_call:
    inputs:
      devfast:
        description: Focused diagnostic only; cannot qualify a release
        type: boolean
        default: false
      linux_pool:
        description: Faster needs an authorized FOUNDATION_FAST_LINUX_RUNNER variable
        type: string
        default: standard
      build_jobs:
        description: Compile concurrency; tests remain bounded independently
        type: string
        default: '2'
      include_arm:
        description: Include native Linux ARM64 execution
        type: boolean
        default: true
