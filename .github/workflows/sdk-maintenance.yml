name: Explicit prepared SDK maintenance
'on':
  workflow_dispatch:
    inputs:
      target:
        description: Explicit producer target
        type: choice
        options:
        - linux-x86_64
        - linux-aarch64
        - windows-x86_64
        - browser-wasm32
        - all
        default: windows-x86_64
      jobs:
        description: Compilation concurrency
        type: choice
        options:
        - '2'
        - '4'
        - '8'
        default: '2'
      execute:
        description: Publish verified complete groups into durable base storage
        type: boolean
        default: false
      profile:
        description: Dependency capability recipe, separate from application features
        type: choice
        options:
        - core
        - all-gui
        default: core
      source:
        description: Select base policy, explicit cold rebuild, or exact unqualified retained bytes
        type: choice
        options:
        - auto
        - base
        - rebuild
        - retained
        default: auto
      retained_input:
        description: Exact JSON producer and group/proof artifact identities for source retained
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - shell: python
      run: |-
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/lifecycle.py', 'sdk-plan'], check=True)
      id: plan
      env:
        TARGET: ${{ inputs.target }}
        SDK_PROFILE: ${{ inputs.profile }}
        SDK_SOURCE: ${{ inputs.source }}
        SDK_RETAINED_INPUT: ${{ inputs.retained_input }}
  produce:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      TARGET: ${{ matrix.target }}
      JOBS: ${{ inputs.jobs }}
      SDK_PROFILE: ${{ inputs.profile }}
      SDK_SOURCE: ${{ inputs.source }}
      SDK_RETAINED_INPUT: ${{ inputs.retained_input }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Explicitly acquire the pinned disposable Windows graphics prerequisite
      if: runner.os == 'Windows' && inputs.profile == 'all-gui'
      run: python .github/scripts/lifecycle.py graphics-maintain
    - name: Resolve exact retained group or positively observed absence
      run: python .github/scripts/lifecycle.py sdk-inputs
    - if: runner.os == 'Windows'
      shell: pwsh
      run: ./tools/ci_windows.ps1 -Output 'build/windows-toolchain.json'
    - shell: python
      run: |
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/container_job.py', 'sdk-produce'], check=True)
      if: runner.os == 'Linux'
    - shell: python
      run: |-
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/lifecycle.py', 'sdk-produce'], check=True)
      if: runner.os == 'Windows'
    - name: Verify complete SDK bytes for unqualified retention
      id: retain
      if: always()
      run: python .github/scripts/lifecycle.py sdk-retain
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && steps.retain.outcome == 'success' && steps.retain.outputs.retained == 'true'
      with:
        name: sdk-group-${{ matrix.target }}-${{ github.run_attempt }}
        path: build/sdk-group/
        if-no-files-found: error
        compression-level: 0
        retention-days: 30
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: sdk-plan-${{ matrix.target }}-${{ github.run_attempt }}
        path: build/sdk-publication-plan.json
        if-no-files-found: error
        compression-level: 0
        retention-days: 30
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: sdk-proof-${{ matrix.target }}-${{ github.run_attempt }}
        path: |-
          build/sdk-origin.json
          build/sdk-isolation.json
          build/sdk-retention.json
          build/sdk-consumer/qualification.json
          build/sdk-consumer/source.junit.xml
          build/sdk-consumer/build/Testing/Temporary/
          build/sdk-gui-consumer/qualification.json
          build/sdk-gui-consumer/source.junit.xml
          build/sdk-gui-consumer/build/Testing/Temporary/
          build/sdk-gui-consumer/build/test-reports/
          build/sdk-gui-consumer/graphics.json
          build/sdk-gui-consumer/graphics-probe.json
          build/sdk-gui-consumer/graphics-test.log
          build/sdk-gui-consumer/graphics-compile.log
          build/sdk-gui-consumer/build/gui/visual-evidence/**/*.json
          build/sdk-gui-consumer/build/gui/visual-evidence/**/*.png
          build/sdk-gui-consumer/build/gui/visual-evidence/**/*.ppm
          build/sdk-gui-consumer/build/gui/visual-evidence/**/*.log
          build/host-graphics/acquisition.json
        if-no-files-found: warn
        compression-level: 0
        retention-days: 30
      if: always()
  publish:
    if: inputs.execute
    needs: produce
    runs-on: ubuntu-24.04
    environment: release-publisher
    concurrency:
      group: foundation-release-lifecycle
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - shell: python
      run: |
        import os,subprocess
        subprocess.run(['gh','run','download',os.environ['GITHUB_RUN_ID'],'--repo',os.environ['GITHUB_REPOSITORY'],'--pattern','sdk-group-*-'+os.environ['GITHUB_RUN_ATTEMPT'],'--dir','build/sdk-groups'],check=True)
    - shell: python
      run: |-
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/lifecycle.py', 'publish-bases'], check=True)
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: sdk-delivery-${{ github.run_attempt }}
        path: build/receipts/
        if-no-files-found: error
        compression-level: 0
        retention-days: 30
      if: always()
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
