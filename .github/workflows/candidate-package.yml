name: Independent native package consumer
'on':
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      runner:
        type: string
        required: true
      build_jobs:
        type: string
        default: auto
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  GH_TOKEN: ${{ github.token }}
jobs:
  package:
    runs-on: ${{ inputs.runner }}
    name: Independent package ${{ inputs.target }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - if: runner.os == 'Windows'
      shell: pwsh
      run: ./tools/ci_windows.ps1
    - env:
        JOBS: ${{ inputs.build_jobs }}
        TARGET: ${{ inputs.target }}
      shell: python
      run: |
        import os, subprocess, sys
        subprocess.run([sys.executable, 'tools/ci_plan.py', 'host', os.environ['TARGET']], check=True)
        subprocess.run([sys.executable, 'tools/ci_plan.py', 'package', '--build', 'build/package',
                        '--jobs', os.environ['JOBS']], check=True)
    - name: Retain verified package-${{ inputs.target }}-${{ github.run_attempt }}
      run: python .github/scripts/lifecycle.py bundle-store
      env:
        BUNDLE_NAME: package-${{ inputs.target }}-${{ github.run_attempt }}
        BUNDLE_PATHS: |
          build/package/packages/*.tar.gz
          build/package/packages/*.zip
          build/package/packages/*.json
    permissions:
      contents: write
      actions: read
  copied:
    # Draft listings require push access even when this job only fetches bytes.
    permissions:
      contents: write
      actions: read
    needs: package
    runs-on: ${{ inputs.runner }}
    name: Fresh copied archive ${{ inputs.target }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        BUNDLE_NAME: package-${{ inputs.target }}-${{ github.run_attempt }}
        BUNDLE_OUTPUT: build/copied
      shell: python
      run: |
        import subprocess,sys
        subprocess.run([sys.executable,'.github/scripts/lifecycle.py','bundle-fetch'],check=True)
        subprocess.run([sys.executable,'tools/ci_plan.py','check-archives','build/copied','--runtime-only'],check=True)
