name: Development feedback
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: feedback-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    name: Focused checks (not release qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test inexpensive contracts
        run: python3 tools/build.py test dev --label fast --jobs 2
      - name: Scope
        if: always()
        run: echo 'Focused feedback only. Full tools, platform, package and GUI qualification are separate.' >> "$GITHUB_STEP_SUMMARY"

  workflow-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflows with a verified official tool
        shell: python
        run: |
          import hashlib, io, os, subprocess, tarfile, urllib.request
          from pathlib import Path
          url = 'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz'
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read(32 * 1024 * 1024 + 1)
          if hashlib.sha256(data).hexdigest() != '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8':
              raise SystemExit('Workflow validator archive differs from reviewed digest')
          with tarfile.open(fileobj=io.BytesIO(data)) as archive:
              member = archive.getmember('actionlint')
              if not member.isfile(): raise SystemExit('Expected ordinary validator executable')
              tool = Path(os.environ['RUNNER_TEMP']) / 'foundation-actionlint'
              with tool.open('xb') as stream: stream.write(archive.extractfile(member).read())
              tool.chmod(0o755)
          subprocess.run([str(tool), '-shellcheck=', '-pyflakes=', *map(str, Path('.github/workflows').glob('*.yml'))], check=True)
