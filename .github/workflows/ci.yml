name: Development feedback
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: feedback-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    name: Focused checks (not release qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test inexpensive contracts
        run: python3 tools/build.py test dev --label fast --jobs 2
      - name: Scope
        if: always()
        run: echo 'Focused feedback only. Full tools, platform, package and GUI qualification are separate.' >> "$GITHUB_STEP_SUMMARY"

  workflow-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflows with installed or exact retained validator
        run: python3 tools/ci_plan.py workflow-lint --retained-url "$RETAINED_URL" --executable "$VALIDATOR" --output build/workflow-lint
        env:
          RETAINED_URL: ${{ vars.FOUNDATION_ACTIONLINT_URL }}
          VALIDATOR: ${{ vars.FOUNDATION_ACTIONLINT_EXECUTABLE }}

  shared-gui:
    name: Shared GUI contracts and generic hosts
    if: vars.FOUNDATION_GUI_GROUP != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore exact repository-retained GUI inputs
        run: python3 .github/scripts/lifecycle.py gui-input
        env:
          GH_TOKEN: ${{ github.token }}
          GUI_INPUT: '{"source":"base","manifest_sha256":"${{ vars.FOUNDATION_GUI_GROUP }}"}'
      - name: Compile shared application once and check generic hosts
        run: python3 -B tools/build.py test dev --gui-input-group build/gui-group --gui-backends terminal,framebuffer,hosted-web --host-tests --label gui --build-jobs 2 --test-jobs 2
