name: Certify exact published candidate
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Exact published candidate tag
        type: string
        required: true
      inventory:
        description: Exact release.json SHA-256
        type: string
        required: true
      profile:
        description: Support policy profile
        type: choice
        options:
        - core
        - all-gui
        default: core
      graphics_archive_url:
        description: Operator-retained HTTPS host graphics archive; required for Windows GUI checks
        type: string
        default: ''
      execute:
        description: Append this immutable certificate attempt to the candidate
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        description: Exact published candidate tag
        type: string
        required: true
      inventory:
        description: Exact release.json SHA-256
        type: string
        required: true
      profile:
        description: Support policy profile
        type: string
        default: core
      graphics_archive_url:
        description: Operator-retained HTTPS host graphics archive; required for Windows GUI checks
        type: string
        default: ''
      execute:
        description: Append this immutable certificate attempt to the candidate
        type: boolean
        default: false
    outputs:
      certificate_sha256:
        description: Verified certificate sha256
        value: ${{ jobs.record.outputs.certificate_sha256 }}
      certification_run:
        description: Verified certification run
        value: ${{ jobs.record.outputs.certification_run }}
      certification_attempt:
        description: Verified certification attempt
        value: ${{ jobs.record.outputs.certification_attempt }}
      inventory_sha256:
        description: Verified inventory sha256
        value: ${{ jobs.record.outputs.inventory_sha256 }}
      eligible_for_promotion:
        description: Verified eligible for promotion
        value: ${{ jobs.record.outputs.eligible_for_promotion }}
      attached:
        description: Verified attached
        value: ${{ jobs.attach.outputs.attached }}
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - shell: python
      run: |-
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/lifecycle.py', 'certification-plan'], check=True)
      id: plan
    - name: Retain verified qualification-inputs-${{ github.run_attempt }}
      run: python .github/scripts/lifecycle.py bundle-store
      env:
        BUNDLE_NAME: qualification-inputs-${{ github.run_attempt }}
        BUNDLE_PATHS: |-
          build/candidate/
          build/delivery.json
          build/check-plan.json
    permissions:
      contents: write
      actions: read
  check:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    env:
      CHECK: ${{ matrix.id }}
      CHECK_IMAGE: ${{ matrix.image }}
      CHECK_BROWSER: ${{ ((matrix.backend == 'hosted-web' && matrix.scope == 'archive') || (matrix.backend == 'wasm' && (matrix.scope
        == 'source' || matrix.scope == 'recovery' || matrix.scope == 'archive'))) && 'yes' || 'no' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - shell: python
      run: |
        import subprocess,sys
        subprocess.run([sys.executable,'.github/scripts/lifecycle.py','bundle-fetch'],check=True)
      env:
        BUNDLE_NAME: qualification-inputs-${{ github.run_attempt }}
        BUNDLE_OUTPUT: build
    - name: Verify the explicitly supplied retained Windows graphics input
      if: runner.os == 'Windows' && matrix.graphics
      run: python .github/scripts/lifecycle.py graphics-input
    - if: runner.os == 'Windows'
      shell: pwsh
      run: ./tools/ci_windows.ps1
    - shell: python
      run: |-
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/lifecycle.py', 'check'], check=True)
      if: runner.os == 'Windows'
    - name: Inspect installed native browser and run exact Ubuntu runtime assertions
      if: runner.os == 'Linux' && matrix.image == ''
      shell: python
      run: |
        import subprocess, sys
        for command in ('check-prerequisites', 'check'):
            subprocess.run([sys.executable, '.github/scripts/lifecycle.py', command], check=True)
    - shell: python
      run: |
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/container_job.py', 'check'], check=True)
      if: runner.os == 'Linux' && matrix.image != ''
    - if: always()
      name: Retain verified evidence-${{ matrix.id }}-${{ github.run_attempt }}
      run: python .github/scripts/lifecycle.py bundle-store
      env:
        BUNDLE_NAME: evidence-${{ matrix.id }}-${{ github.run_attempt }}
        BUNDLE_PATHS: build/evidence/${{ matrix.id }}/
    - if: always() && runner.os == 'Linux' && env.CHECK_BROWSER == 'yes'
      name: Retain verified browser-prerequisite-${{ matrix.id }}-${{ github.run_attempt }}
      run: python .github/scripts/lifecycle.py bundle-store
      env:
        BUNDLE_NAME: browser-prerequisite-${{ matrix.id }}-${{ github.run_attempt }}
        BUNDLE_PATHS: build/prerequisites/${{ matrix.id }}/browser.json
    permissions:
      contents: write
      actions: read
  record:
    if: always() && needs.prepare.result == 'success'
    needs:
    - prepare
    - check
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - shell: python
      run: |
        import subprocess,sys
        subprocess.run([sys.executable,'.github/scripts/lifecycle.py','bundle-fetch'],check=True)
      env:
        BUNDLE_NAME: qualification-inputs-${{ github.run_attempt }}
        BUNDLE_OUTPUT: build
    - shell: python
      run: |
        import subprocess,sys
        subprocess.run([sys.executable,'.github/scripts/lifecycle.py','fetch-evidence-bundles'],check=True)
    - shell: python
      run: |-
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/lifecycle.py', 'certificate'], check=True)
      id: result
    - if: always()
      name: Retain verified certificate-${{ github.run_attempt }}
      run: python .github/scripts/lifecycle.py bundle-store
      env:
        BUNDLE_NAME: certificate-${{ github.run_attempt }}
        BUNDLE_PATHS: |-
          build/candidate/
          build/delivery.json
          build/check-plan.json
          build/evidence/
          build/certificate.json
          build/attachment-plan.json
    permissions:
      contents: write
      actions: read
    outputs:
      certificate_sha256: ${{ steps.result.outputs.certificate_sha256 }}
      certification_run: ${{ steps.result.outputs.certification_run }}
      certification_attempt: ${{ steps.result.outputs.certification_attempt }}
      inventory_sha256: ${{ steps.result.outputs.inventory_sha256 }}
      eligible_for_promotion: ${{ steps.result.outputs.eligible_for_promotion }}
  attach:
    if: inputs.execute && always() && needs.record.result == 'success'
    needs: record
    runs-on: ubuntu-24.04
    environment: release-publisher
    concurrency:
      group: foundation-release-lifecycle
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - shell: python
      run: |
        import subprocess,sys
        subprocess.run([sys.executable,'.github/scripts/lifecycle.py','bundle-fetch'],check=True)
      env:
        BUNDLE_NAME: certificate-${{ github.run_attempt }}
        BUNDLE_OUTPUT: build
    - shell: python
      run: |-
        import subprocess, sys
        subprocess.run([sys.executable, '.github/scripts/lifecycle.py', 'attach-certificate'], check=True)
      id: result
    - if: always()
      name: Retain verified certification-delivery-${{ github.run_attempt }}
      run: python .github/scripts/lifecycle.py bundle-store
      env:
        BUNDLE_NAME: certification-delivery-${{ github.run_attempt }}
        BUNDLE_PATHS: build/receipts/
    outputs:
      attached: ${{ steps.result.outputs.attached }}
  verdict:
    if: always()
    needs:
    - prepare
    - check
    - record
    - attach
    runs-on: ubuntu-24.04
    env:
      RESULTS: ${{ toJSON(needs) }}
      EXECUTE: ${{ inputs.execute }}
    steps:
    - shell: python
      run: |
        import json,os
        results=json.loads(os.environ['RESULTS'])
        required=['prepare','check','record'] + (['attach'] if os.environ['EXECUTE']=='true' else [])
        if any(results[k]['result'] != 'success' for k in required): raise SystemExit('Incomplete or failed exact qualification; inspect retained evidence')
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  TAG: ${{ inputs.tag }}
  INVENTORY: ${{ inputs.inventory }}
  PROFILE: ${{ inputs.profile }}
  GRAPHICS_ARCHIVE_URL: ${{ inputs.graphics_archive_url }}
